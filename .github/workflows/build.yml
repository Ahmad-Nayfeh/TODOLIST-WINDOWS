name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test (Windows desktop code)
        run: python tests/smoke_windows.py

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Build TodoWidget.exe
        run: pyinstaller --onefile --windowed --name TodoWidget todo_widget.py

      - name: Check the EXE starts and keeps running
        shell: pwsh
        run: |
          $p = Start-Process dist\TodoWidget.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "TodoWidget.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Output "EXE ran for 8 seconds without crashing"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoWidget
          path: dist/TodoWidget.exe

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Todo Widget (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/TodoWidget.exe
          body: |
            Download **TodoWidget.exe** below and double-click it. No installation needed.
            Built from commit ${{ github.sha }}.
